name: Homero — Generar Audiolibro, Karaoke, EPUB y PDF

on:
  push:
    branches:
      - main
    paths:
      - "capitulos/**"
      - "libro.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar-libro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout odisea.deft.work
        uses: actions/checkout@v4

      - name: Checkout motor Homero
        uses: actions/checkout@v4
        with:
          repository: elswork/homero
          path: .homero-engine

      - name: Instalar fuentes y dependencias de Homero
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r .homero-engine/requirements.txt

      - name: Compilar Audiolibro, Sincronización Karaoke, EPUB y PDF
        run: |
          python3 .homero-engine/homero.py build --book-dir .
          rm -rf .homero-engine

      - name: Guardar archivos generados en el repositorio
        run: |
          git config user.name "Homero Bot (.ia)"
          git config user.email "elswork@gmail.com"
          git add audio/ descargas/ homero-bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(homero): actualizar audiolibro, karaoke, EPUB y PDF"
            git push
          fi
